def excludes = [
  '**/Application*',
  '**/CustomRequestInterceptor*',
  '**/WebMvcConfig*',
  '**/WebSecurityConfig*',
  '**/healthcheck/**',
  '**/clients/**',
  '**/dtos/**',
  '**/entities/**',
  '**/exceptions/**',
  '**/commons/**',
  '**/models/**',
  '**/repositories/**',
  '**/utils/**'
]

jacocoTestReport {
  reports {
    xml.required = false
    csv.required = false
    html.required = true
    html.outputLocation = file("${buildDir}/jacocoHtml")
  }
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(dir: it, exclude: excludes) }))
  }
}

jacocoTestCoverageVerification {
  doFirst {
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(dir: it, exclude: excludes) }))
  }
  violationRules {
    rule {
      enabled = true
      limit {
        minimum = 0.7
      }
    }
  }
}
